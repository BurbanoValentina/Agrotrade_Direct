name: agrotrade_direct
description: "AgroTrade Direct — negociación P2P de café y cacao entre Colombia y la UE."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2       # Manejo de estado de la app
  google_fonts: ^6.2.1   # Tipografías (serif en títulos, sans en cuerpo, como el mockup)
  intl: ^0.19.0          # Formato de moneda, fechas y toneladas

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
